# Bertmini Linux/F2 runtime workload on the pair-manager dummy8x8 sbus64 target,
# using the cfg32 + NIC-enabled noTrace AGFI for host<->guest gdbserver attach.

run_farm:
  base_recipe: run-farm-recipes/aws_ec2.yaml
  recipe_arg_overrides:
    run_farm_tag: pairbertb8d12s64gdbcfg32nicnt
    always_expand_run_farm: true
    launch_instances_timeout_minutes: 60
    run_instance_market: ondemand
    spot_interruption_behavior: terminate
    spot_max_price: ondemand
    default_simulation_dir: /home/ubuntu
    run_farm_hosts_to_use:
      - f2.6xlarge: 1
      - f2.12xlarge: 0
      - f2.48xlarge: 0
      - m4.16xlarge: 0
      - z1d.3xlarge: 0
      - z1d.6xlarge: 0
      - z1d.12xlarge: 0

metasimulation:
  metasimulation_enabled: false
  metasimulation_host_simulator: verilator
  metasimulation_only_plusargs: "+fesvr-step-size=128 +max-cycles=100000000"
  metasimulation_only_vcs_plusargs: "+vcs+initreg+0 +vcs+initmem+0"

target_config:
  topology: example_1config
  no_net_num_nodes: 1
  link_latency: 6405
  switching_latency: 10
  net_bandwidth: 200
  profile_interval: -1
  default_hw_config: firesim_gemmini_rerocc_pairmanager_dummy8x8_4c12p12_sbus64_cfg32_nic_notrace
  plusarg_passthrough: "+simplenic-relaxed-required-bytes=1 +simplenic-empty-switch-poll-interval=1024 +simplenic-token-debug=0 +cpu-managed-stream-debug=0 +heartbeat-polling-interval=100000000"

tracing:
  enable: no
  output_format: 0
  selector: 1
  start: 0
  end: -1

autocounter:
  read_rate: 0

workload:
  workload_name: rerocc-lc-linux-coupleddma-bertmini-pipeline-runtime-batch8-fileonly-sync-pairdummy-gdbserver.json
  terminate_on_completion: no
  suffix_tag: f2-gemmini-rerocc-pairmanager-dummy8x8-4c12p12-sbus64-linux-bertmini-batch8-fileonly-sync-gdbserver-cfg32-nic-notrace

host_debug:
  zero_out_dram: no
  disable_synth_asserts: no

synth_print:
  start: 0
  end: -1
  cycle_prefix: yes
